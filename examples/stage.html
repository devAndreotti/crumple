<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crumple: stage example</title>
  <style>
    body { margin: 0; background: #16130f; color: #ebe5d6; font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    canvas { width: min(92vw, 560px); height: 70vh; display: block; }
    .bar { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    button { background: #2a231b; color: inherit; border: 1px solid #5a4f40; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <canvas id="c"></canvas>
    <div class="bar">
      <button data-a="toggle">crumple / unfold</button>
      <button data-a="flip">flip</button>
      <button data-a="burn">burn</button>
      <button data-a="restore">restore</button>
    </div>
  </div>

  <script src="../dist/crumple.min.js"></script>
  <script>
    Crumple.config.assets = '../assets/';
    const stage = Crumple.Stage(document.getElementById('c'), { fit: 0.8 });
    stage.set({ type: 'polaroid', image: '../assets/photos/sea.webp', text: 'the sea, at last', back: 'keep this one' }, { progress: 0 })
      .then(() => setTimeout(() => stage.uncrumple(), 400));
    document.querySelector('.bar').addEventListener('click', (e) => { const a = e.target.dataset.a; if (a) stage[a](); });
  </script>
</body>
</html>
